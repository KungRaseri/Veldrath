# nginx config for the docfx site image (docs/Dockerfile).
#
# Two things matter here and neither is nginx's default:
#   * gzip. The search index is ~4 MB of JSON and the stylesheet ~300 KB; uncompressed they dominate
#     the first visit. docfx output is static, so compression is free at request time.
#   * caching. Fonts and hashed-free static assets rarely change between builds, HTML should always
#     revalidate.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/woff2;

    # Search index: big, and only useful for the current session.
    location = /index.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # Fonts first (regex locations match in order): nginx's stock mime.types does not map
    # .ttf/.woff2, so without this they go out as application/octet-stream.
    location ~* \.(?:woff2?|ttf)$ {
        types {
            font/woff2 woff2;
            font/ttf ttf;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Fonts and images are content-addressed by name in practice; a week is plenty.
    location ~* \.(?:css|js|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # docfx writes directory/index.html and page.html; accept the extensionless form too.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
