# docs/design/content/pools/tidewrack-flats.yaml
# Veldrath spawn pools — zone: tidewrack-flats (region: saltcliff)
# Values and the reasoning behind them: docs/design/content/pool-matrix.md (card t_af051fc2, D4).
# DESIGN DATA, not an importable pack yet. The pack importer reads content/<family>/*.yaml and
# rejects an unknown spawn archetype (missing-spawn-archetype, Error), and 15 of the pooled
# archetypes are not seeded. These files move to content/zonelocations/ once they are — the
# translation is written out in pool-matrix.md §8.
# Roster size is engine-fixed at 2-4 per location (ActorPoolResolver.cs:27-28). There is no
# per-location roster field, so none is authored here — do not invent one.
# Weights are RELATIVE integers (ActorPoolResolver.cs:187-198), never percentages, and must be
# >= 1. The importer must not normalise them; only the ratio is meaningful.
# "excluded: true" with an empty pool is authored content, not an omission: a town, a respawn
# point or a dungeon lobby deliberately spawns nothing (ActorPoolResolver.cs:80-86).
schema_version: 1
zone: tidewrack-flats
region: saltcliff
locations:
  - slug: wrack-shore
    # band: b11-14 (D0 budget) | location L12-18
    level_range: [12, 18]
    pool:
      - archetype: tide-strider
        weight: 4   # band: 13-15 | to be seeded 13-15
      - archetype: drowned-revenant
        weight: 3   # band: 13-15 | seeded 11-18
      - archetype: gull-rider-skirmisher
        weight: 3   # band: 13-15 | to be seeded 13-15
  - slug: bone-strand
    # band: b11-14 (D0 budget) | location L13-18
    level_range: [13, 18]
    pool:
      - archetype: gull-rider-skirmisher
        weight: 4   # band: 13-15 | to be seeded 13-15
      - archetype: tide-strider
        weight: 3   # band: 13-15 | to be seeded 13-15
      - archetype: gull-rider-brute
        weight: 3   # band: 16-18 | seeded 13-18
  - slug: tidal-grotto
    # band: b11-14 (D0 budget) | location L14-18
    level_range: [14, 18]
    pool:
      - archetype: drowned-revenant
        weight: 4   # band: 13-15 | seeded 11-18
      - archetype: tide-strider
        weight: 3   # band: 13-15 | to be seeded 13-15
      - archetype: storm-harrower
        weight: 3   # band: 16-18 | seeded 15-20

# Coverage for this zone (design check, not a field the importer reads):
#   locations 3 | pooled 3 | excluded 0
