# Content pack — enemy drop tables for budget band b7-10 (levels 7-10).
#
# family: loottable. One table per hostile archetype; slug `<archetype>-drops`.
#
# Band b7-10 (game-context/budget.yaml): gold [8, 30], drop_chance [0.20, 0.50].
# Every table sums to 100, so DropWeight reads as that row's landing probability
# (loot.weight_semantics). Every row lands with 0.20 <= p <= 0.50: inside the band.
# No guaranteed row: nothing in the design says a b7-10 kill always yields something.
# Item ceiling: 90 gold = 3 x the band's gold max. rune-of-power, elixir-of-strength and
# iron-chestplate (80 each) come inside the ceiling here and enter the tables at this band.
# Gems (150+) stay out until b15-18.
#
# The four roster rows banded 10-12 — cairn-haunt, fen-lurker, burrow-worm, bog-lantern — are in
# this file, not the next one: their band floor is 10, and level 10 is the last level of b7-10.
# The band that contains an archetype's floor is the band its stat line and drop chance come from.

family: loottable
entities:
  - slug: moor-wight-drops
    # band: b7-10 — moor-wight, roster band 7-9; spawns at bone-hollow (L4-6), ashveil-highlands
    # (L7-12), shifting-waymark (L8-14)
    # Why: a caster of the unquiet dead that walks with a cold that spoils a fire. Shadow is what is
    # left of it, a soul crystal is what it will not give up, and frost is the cold it carries.
    typeKey: enemies
    displayName: Moor Wight Drops
    rarityWeight: 80
    traits:
      common: true
      boss: false
      elite: false
      rare: false
      isChest: false
      isHarvesting: false
    entries:
      - itemDomain: items/general
        itemSlug: rune-of-frost
        dropWeight: 50
        quantityMin: 1
        quantityMax: 1
        isGuaranteed: false
      - itemDomain: items/general
        itemSlug: soul-crystal
        dropWeight: 30
        quantityMin: 1
        quantityMax: 1
        isGuaranteed: false
      - itemDomain: items/general
        itemSlug: essence-of-shadow
        dropWeight: 20
        quantityMin: 1
        quantityMax: 1
        isGuaranteed: false

