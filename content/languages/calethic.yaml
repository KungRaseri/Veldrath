family: language
entities:
  - slug: "calethic"
    typeKey: "language"
    displayName: "Calethic"
    rarityWeight: 100
    isActive: true
    description: "The constructed language of the Caleth Empire. Calethic is an architectural, hard-sounding language built on a small set of CVC roots that compound freely. It operates in three registers—administrative, formal, and vaeld (ceremonial)—each with distinct word order and vowel quality. The language is notable for its junction-reduction rules at compound boundaries and its deliberate exclusion of sibilants from all non-ceremonial speech."
    tonalCharacter: "Hard + Formal — short architectural roots (K, R, TH, V, D) in functional vocabulary; drawn-out compound forms in titles and ceremonial speech."
    sampleText: "Aethori vel kaeld — Thorn-kael-Aethori naeldithorn Kaelorneth."
    phonology:
      consonants:
        - description: "Voiceless velar stop"
          symbol: "K"
          notes: "Most frequent initial consonant; architectural, hard"
        - description: "Voiced velar stop"
          symbol: "G"
          notes: "Less common; appears in roots relating to corruption/testing"
        - description: "Voiceless alveolar stop"
          symbol: "T"
          notes: "Clean, administrative"
        - description: "Voiced alveolar stop"
          symbol: "D"
          notes: "Common in place-root compounds"
        - description: "Alveolar trill/rhotic"
          symbol: "R"
          notes: "The most architectural sound; used in sonorant clusters"
        - description: "Lateral approximant"
          symbol: "L"
          notes: "Appears in suffix/compound forms; softer than R"
        - description: "Voiced labiodental fricative"
          symbol: "V"
          notes: "Marks prestige-register words; heard in vel-, vrath, veld"
        - description: "Voiced dental fricative (as in 'thee')"
          symbol: "TH"
          notes: "Authority marker; the voiced form gives weight"
        - description: "Voiceless glottal fricative"
          symbol: "H"
          notes: "Appears as root-initial (hald), in compound junctions, and H-mutation corruption forms (K- → H- in frontier speech)"
        - description: "Nasal"
          symbol: "N"
          notes: "Common in suffixes and terminals"
        - description: "Nasal"
          symbol: "M"
          notes: "Less frequent than N"
        - description: "Voiceless alveolar sibilant"
          symbol: "S"
          notes: "Ceremonial register only — Aethori ritual speech (vaeld). Absent from functional vocabulary."
        - description: "Voiceless postalveolar sibilant"
          symbol: "SH"
          notes: "Ceremonial register only — same restriction as S."
      vowels:
        - symbol: "a"
          sound: "/a/ as in 'father'"
          register: "functional"
          notes: "Short vowel used in roots and administrative speech"
        - symbol: "e"
          sound: "/ɛ/ as in 'bed'"
          register: "functional"
          notes: "Short vowel used in roots and administrative speech"
        - symbol: "i"
          sound: "/ɪ/ as in 'bit'"
          register: "functional"
          notes: "Short vowel"
        - symbol: "o"
          sound: "/ɔ/ as in 'lot'"
          register: "functional"
          notes: "Short vowel. /u/ is excluded from Calethic entirely."
        - symbol: "ae"
          sound: "/eɪ/ as in 'day'"
          register: "formal"
          notes: "The dominant Calethic diphthong; appears in kael, aeth, vael, rael"
        - symbol: "ei"
          sound: "/iː/ as in 'see'"
          register: "formal"
          notes: "Rare; appears in high-prestige titles and old formal compounds"
        - symbol: "or"
          sound: "/ɔːr/ as in 'ore'"
          register: "formal"
          notes: "Common in abstract-noun suffix -or and keeper suffix -ori"
        - symbol: "ael"
          sound: "/eɪl/"
          register: "formal"
          notes: "Vowel-and-lateral unit — nucleus of sworn-body suffix -ael"
        - symbol: "ald"
          sound: "/ɔːld/"
          register: "formal"
          notes: "Vowel-and-cluster unit — appears in place suffix -ald and roots like daeld"
      allowedSyllablePatterns:
        - "CVC"
        - "CV"
        - "CVCC"
      allowedInitialClusters:
        - "VR-"
        - "KR-"
        - "DR-"
        - "THL-"
      forbiddenClusters:
        - "S-"
        - "SH-"
        - "three consecutive consonants"
        - "word-initial affricate"
      allowedFinalClusters:
        - "-LD"
        - "-LT"
        - "-RN"
        - "-TH"
        - "-VN"
        - "-RG"
        - "-LN"
        - "-ND"
      junctionRules:
        - cluster: "-d + r-"
          rule: "D drops before R (D-drop)"
          formalExample: "vaeld + raeth → Vaelraeth"
          administrativeExample: "same"
        - cluster: "-l + vr-"
          rule: "V-drop; formal register adds euphonic -d- bridge at l+r juncture"
          formalExample: "vel + vrath → veldrath"
          administrativeExample: "vael + vren → vaelren (no bridge)"
        - cluster: "-ld + TH-"
          rule: "D is preserved; epenthetic -i- inserted as a liaison vowel between -ld and TH-"
          formalExample: "naeld + thorn → Naeldithorn"
          administrativeExample: "(no administrative variant attested)"
    morphology:
      roots:
        - token: "aeth"
          coreMeaning: "covenant, compact, the binding agreement"
          extendedMeanings: "the sacred contract mediating the empire's power"
          exampleWord: "Aethori"
          category: "metaphysical"
        - token: "kael"
          coreMeaning: "bind, contain, hold by compact"
          extendedMeanings: "as prefix: great, first, paramount"
          exampleWord: "Kaeldor"
          category: "metaphysical"
        - token: "orn"
          coreMeaning: "dissolve, unmake, reverse a binding"
          extendedMeanings: "the catastrophic end of a structured arrangement"
          exampleWord: "Kaelorneth"
          category: "metaphysical"
        - token: "veld"
          coreMeaning: "the unconstrained, the void-beyond"
          extendedMeanings: "existence without limit; the essential quality of the being"
          exampleWord: "Orveld"
          category: "metaphysical"
        - token: "rael"
          coreMeaning: "presence, assertion of existence"
          extendedMeanings: "a presence that insists on being here; the being's local manifestation"
          exampleWord: "Raelaethori"
          category: "metaphysical"
        - token: "thar"
          coreMeaning: "true, genuine, oath-bound, absolute"
          extendedMeanings: "affirms; marks things that cannot be unsaid or undone"
          exampleWord: "Tharkael"
          category: "metaphysical"
        - token: "naeld"
          coreMeaning: "seal, permanent closure, lock-with-no-key"
          extendedMeanings: "a closing that is not meant to be opened"
          exampleWord: "Naeldithorn"
          category: "metaphysical"
        - token: "gorv"
          coreMeaning: "contaminate, alter, corrupt"
          extendedMeanings: "the process of contact with veld; what happens to land and minds near the compact"
          exampleWord: "Gorveld"
          category: "metaphysical"
        - token: "draek"
          coreMeaning: "channel, medium, the interface"
          extendedMeanings: "the priestly function between compact parties"
          exampleWord: "Draekori"
          category: "metaphysical"
        - token: "vaeld"
          coreMeaning: "proximity, the approach, border-of-the-sacred"
          extendedMeanings: "the zone between the ordinary and the compact; also a register name"
          exampleWord: "Vaelraeth"
          category: "metaphysical"
        - token: "thael"
          coreMeaning: "illuminate, force-knowing, revelation"
          extendedMeanings: "what the compact did to the Aethori — made them know things they couldn't unlearn"
          exampleWord: "Thaelornvael"
          category: "metaphysical"
        - token: "kaeld"
          coreMeaning: "the performed binding act, the compact-in-action"
          extendedMeanings: "lexicalized derived root: kael + actional -d suffix"
          exampleWord: "Kaeldor"
          category: "metaphysical"
        - token: "cal"
          coreMeaning: "order, law, structured arrangement"
          extendedMeanings: "the right-and-fitting arrangement of things; the principle behind the empire"
          exampleWord: "Caleth"
          category: "political"
        - token: "vrath"
          coreMeaning: "command, applied force, power-in-action"
          extendedMeanings: "force directed by will; also the material force of the empire"
          exampleWord: "Veldrath"
          category: "political"
        - token: "tharg"
          coreMeaning: "authority, rank, right-to-command"
          extendedMeanings: "the formal quality of having standing to give orders"
          exampleWord: "Tharg-ari"
          category: "political"
        - token: "rek"
          coreMeaning: "administer, maintain, keep in place"
          extendedMeanings: "the bureaucratic function; keeping arrangements functioning"
          exampleWord: "Rekern"
          category: "political"
        - token: "kaen"
          coreMeaning: "duty, obligation, service"
          extendedMeanings: "given downward to subordinates; what a superior assigns"
          exampleWord: "Kaenvel"
          category: "political"
        - token: "geld"
          coreMeaning: "tribute, give-upward"
          extendedMeanings: "the material of obligation flowing upward to authority"
          exampleWord: "Geld-or"
          category: "political"
        - token: "mael"
          coreMeaning: "decree, formally name, invoke-officially"
          extendedMeanings: "the act of naming a thing makes it subject to the order's law"
          exampleWord: "Mael-eth"
          category: "political"
        - token: "vel"
          coreMeaning: "endure, persist, remain"
          extendedMeanings: "also: former, old, established — that which outlasts change"
          exampleWord: "Vel-Kael"
          category: "political"
        - token: "dorn"
          coreMeaning: "below, descend, subordinate"
          extendedMeanings: "directional and hierarchical; what is ranked beneath"
          exampleWord: "Dornkeld"
          category: "political"
        - token: "hald"
          coreMeaning: "high, elevate, prominent"
          extendedMeanings: "directional and hierarchical; what is conspicuously raised"
          exampleWord: "Haldor"
          category: "political"
        - token: "ori"
          coreMeaning: "keeper, bearer, agent of"
          extendedMeanings: "pure agentive root used standalone in priestly speech; same root as bound suffix -ori"
          exampleWord: "Aethori"
          category: "priestly"
        - token: "thorn"
          coreMeaning: "witness, formally observe, attest"
          extendedMeanings: "to see something in a way that binds you to it"
          exampleWord: "Thorn-kael"
          category: "priestly"
        - token: "naek"
          coreMeaning: "invoke, call, summon through ritual"
          extendedMeanings: "the formal act of reaching across the compact's threshold"
          exampleWord: "Naek-ori"
          category: "priestly"
        - token: "vaeln"
          coreMeaning: "adhere to, follow, carry the directives of"
          extendedMeanings: "what the Bound do — follow instructions they don't fully understand"
          exampleWord: "Vaeln-Aethori"
          category: "priestly"
        - token: "eld"
          coreMeaning: "ground, place, site"
          extendedMeanings: "where something is located; the territory of a thing"
          exampleWord: "Aetheld"
          category: "geographic"
        - token: "korr"
          coreMeaning: "passage, way, corridor"
          extendedMeanings: "movement between places; transit"
          exampleWord: "Korrveld"
          category: "geographic"
        - token: "vren"
          coreMeaning: "frontier, edge, limit"
          extendedMeanings: "the empire's reach ending here; the experimental fringe"
          exampleWord: "Vraen"
          category: "geographic"
        - token: "gael"
          coreMeaning: "water, flow, yielding"
          extendedMeanings: "water and yielding share a root — what yields to terrain"
          exampleWord: "Gaeleld"
          category: "geographic"
        - token: "drak"
          coreMeaning: "stone, unyielding, permanent material"
          extendedMeanings: "what cannot be moved or changed by ordinary means"
          exampleWord: "Drakeld"
          category: "geographic"
        - token: "keld"
          coreMeaning: "hollow, pit, cavity below ground"
          extendedMeanings: "a space that goes down; absence in the earth"
          exampleWord: "Dornkeld"
          category: "geographic"
        - token: "ald"
          coreMeaning: "open space, plain, flat ground"
          extendedMeanings: "visible, unobstructed territory; free root form of bound suffix -ald"
          exampleWord: "Kael-Ald"
          category: "geographic"
        - token: "raeth"
          coreMeaning: "threshold, boundary marker, point of crossing"
          extendedMeanings: "a marked point where one thing ends and another begins"
          exampleWord: "Kael-Raeth"
          category: "geographic"
        - token: "theld"
          coreMeaning: "controlled entry point, administered threshold"
          extendedMeanings: "more specific than raeth — a crossing that is managed"
          exampleWord: "Kaeltheld"
          category: "geographic"
        - token: "laeld"
          coreMeaning: "root (plant), the thing that holds ground"
          extendedMeanings: "lit. 'land-anchor'; also: what anchors any structure"
          exampleWord: "Laeld-eld"
          category: "geographic"
        - token: "daeld"
          coreMeaning: "ash, what-remains-after-fire"
          extendedMeanings: "the trace left when a structured thing is undone"
          exampleWord: "Daeld-Ald"
          category: "material"
        - token: "korn"
          coreMeaning: "bone, structural interior, what holds form"
          extendedMeanings: "the underlying structure, the essential skeleton"
          exampleWord: "Korn-keld"
          category: "material"
        - token: "vaen"
          coreMeaning: "iron, metal, hard-refined material"
          extendedMeanings: "refined substance used in weapons and binding tools"
          exampleWord: "Vaen-eld"
          category: "material"
        - token: "raek"
          coreMeaning: "light-in-material, glow, luminescence"
          extendedMeanings: "distinct from thael (metaphysical light); raek is light visible in physical objects"
          exampleWord: "Raek-ith"
          category: "material"
        - token: "meld"
          coreMeaning: "still water, standing water, mire"
          extendedMeanings: "distinct from gael (flowing); meld is water that does not move"
          exampleWord: "Meld-eld"
          category: "material"
        - token: "grev"
          coreMeaning: "trial, test, examine"
          extendedMeanings: "what was done at Greveld (Grevenmire) — formal testing"
          exampleWord: "Greveld"
          category: "action"
        - token: "kel"
          coreMeaning: "one, first"
          extendedMeanings: "prefix form: kel-"
          exampleWord: "Kel-Thornkaelaethori"
          category: "numeral"
        - token: "dael"
          coreMeaning: "two, the pair, second"
          extendedMeanings: ""
          exampleWord: "Dael-"
          category: "numeral"
        - token: "thornel"
          coreMeaning: "three; from thorn-ael (three-sworn)"
          extendedMeanings: "echoes 'three witnesses' in Calethic ritual; -ael → -el contraction applies"
          exampleWord: "Thornel"
          category: "numeral"
        - token: "vael"
          coreMeaning: "four (long-vowel formal number)"
          extendedMeanings: "three distinct uses by position: standalone=four; prefix=former; ceremonial terminal=the enduring"
          exampleWord: "Thaelornvael"
          category: "numeral"
        - token: "kornel"
          coreMeaning: "five; from korn-ael (five-boned)"
          extendedMeanings: "echoes 'five-boned structure' — the structural number; -ael → -el contraction applies"
          exampleWord: "Kornel"
          category: "numeral"
      prefixes:
        - form: "kael–"
          category: "intensifier"
          coreMeaning: "great, first, paramount"
          notes: "Derives from root kael. Spoken-corruption kal– is not a formal prefix."
        - form: "vel– / vael–"
          category: "temporal"
          coreMeaning: "vel–: still enduring; vael–: formerly, of past-times"
          notes: "vael is also the numeral four; context distinguishes prefix from numeral."
        - form: "dorn– / dor–"
          category: "directional"
          coreMeaning: "deep, hidden, below"
          notes: "dor– is a spoken-reduction variant; not used in formal coinages."
        - form: "hald–"
          category: "directional"
          coreMeaning: "high, elevated, prominent"
          notes: "Also used directionally."
        - form: "thar–"
          category: "affirmative"
          coreMeaning: "true, genuine, oath-bound"
          notes: "Affirms; only used in formal/title contexts."
        - form: "or–"
          category: "negation"
          coreMeaning: "without, not, reversal of"
          notes: "The antonym prefix. Homophonous with suffix -or; differentiate by position."
        - form: "naeld–"
          category: "closure"
          coreMeaning: "sealed, permanent, closed"
          notes: "Implies no exit or reversal."
        - form: "gorv–"
          category: "corruption"
          coreMeaning: "corrupted, wrong, altered"
          notes: "Place-name prefix when land was changed by the compact's work."
        - form: "rek–"
          category: "admin"
          coreMeaning: "orderly, administered"
          notes: "Administrative prefix."
        - form: "grev–"
          category: "examination"
          coreMeaning: "tested, examined, trialled"
          notes: "Historical prefix in sites used for experiments."
        - form: "kel–"
          category: "ordinal"
          coreMeaning: "first (ordinal)"
          notes: "See §4.8."
        - form: "dael–"
          category: "ordinal"
          coreMeaning: "second (ordinal)"
          notes: "See §4.8."
      suffixes:
        - form: "-eth / -ath"
          category: "polity"
          coreMeaning: "the ordered totality of X"
          notes: "-ath is an archaic dialectal variant; new coinages use -eth."
        - form: "-ori / -ari"
          category: "agentive"
          coreMeaning: "keeper, bearer, agent of X"
          notes: "-ori is priestly (Aethori-tier); -ari is administrative (non-priestly)."
        - form: "-eld"
          category: "place"
          coreMeaning: "the site/location of X"
          notes: "Marks a specific, bounded or managed site."
        - form: "-ald"
          category: "place"
          coreMeaning: "the open expanse of X"
          notes: "Marks topographically open ground. Not interchangeable with -eld."
        - form: "-ael / -aen"
          category: "sworn-body"
          coreMeaning: "those who are bound by X"
          notes: "-ael is archaic written; -aen is standard spoken/administrative."
        - form: "-or"
          category: "abstract-noun"
          coreMeaning: "the state/condition of X"
          notes: "Homophonous with prefix or–; differentiate by position."
        - form: "-ith"
          category: "instrument"
          coreMeaning: "the thing that does X"
          notes: ""
        - form: "-ern"
          category: "agentive"
          coreMeaning: "one who does/manages X (non-priestly)"
          notes: ""
        - form: "-eldh"
          category: "place"
          coreMeaning: "place, site, waypoint (archaic compound variant of -eld)"
          notes: "Implies a managed transit point rather than a general site."
        - form: "-d"
          category: "actional"
          coreMeaning: "instantiated/performed form"
          notes: "Actional suffix that lexicalizes a root into its performed-act form (e.g. kael → kaeld)."
    registerSystem:
      registers:
        - name: "Administrative"
          usage: "Bureaucratic reports, commands, records"
          wordOrder: "SVO"
          vowelQuality: "Short vowels throughout"
          notes: "The everyday working register of the Caleth Empire."
        - name: "Formal"
          usage: "Decrees, titles, declarations"
          wordOrder: "Modifier-before-head; compounds"
          vowelQuality: "Long vowels in head position"
          notes: "Used when invoking authority or constructing canonical titles."
        - name: "Vaeld"
          usage: "Aethori ritual speech; compact invocation"
          wordOrder: "VOS (verb-first)"
          vowelQuality: "Long vowels + sibilants permitted"
          notes: "Ceremonial register exclusively. Sibilants (S, SH) are only permitted here. Named after vaeld (proximity to the sacred)."
