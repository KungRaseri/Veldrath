# docker-compose.prod.yml — Production overrides for veldrath.com on Hetzner
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file:
#   - Uses an external reverse proxy (Coolify Traefik) for TLS and routing
#   - Switches server/web/discord to pre-built GHCR images
#   - Removes host port exposure; services are reached on the Docker network
#   - Wires production environment variables for email and public URLs
#   - Sets restart policies for all services

services:
  server:
    # Use the pre-built image from GHCR; CI pushes this on every merge to main.
    image: ghcr.io/kungraseri/veldrath-server:latest
    # Reached by the external proxy on the Docker network.
    ports: []
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Email: use the production SMTP relay defined in .env
      - Email__SmtpHost=${EMAIL_SMTP_HOST}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__EnableTls=${EMAIL_ENABLE_TLS:-true}
      - Email__User=${EMAIL_USER}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__SenderAddress=${EMAIL_SENDER_ADDRESS:-noreply@veldrath.com}
      - Email__SenderName=Veldrath
      # Public base URL for the main website — used to build email links
      - Web__BaseUrl=https://veldrath.com
      # Shared secret for the internal email relay called by Better Auth.
      - InternalBridge__Token=${INTERNAL_BRIDGE_TOKEN}
      # Seq log shipping — internal container reference (unchanged from base)
      - Seq__ServerUrl=http://seq
    restart: unless-stopped

  web:
    image: ghcr.io/kungraseri/veldrath-web:latest
    ports: []
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - ORIGIN=https://veldrath.com
      - BETTER_AUTH_URL=https://veldrath.com
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=postgres://${AUTH_DB_USER:-veldrath_auth}:${AUTH_DB_PASSWORD}@postgres:5432/veldrath
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=Veldrath.Server
      - JWT_AUDIENCE=Veldrath.Client
      - PUBLIC_API_URL=https://api.veldrath.com
      - PUBLIC_HUB_URL=https://api.veldrath.com/hubs/game
      # Internal container URL for the email relay and server-side API calls.
      - INTERNAL_BRIDGE_URL=http://server:8080
      - INTERNAL_BRIDGE_TOKEN=${INTERNAL_BRIDGE_TOKEN}
      - DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${OAUTH_DISCORD_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${OAUTH_MICROSOFT_TENANT_ID:-}
      # External proxy forwarded headers (Traefik / Coolify).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy

  discord:
    # Use the pre-built image from GHCR.
    image: ghcr.io/kungraseri/veldrath-discord:latest
    environment:
      - DOTNET_ENVIRONMENT=Production
    restart: unless-stopped

  postgres:
    # Remove direct port exposure in production — only internal services connect.
    ports: []
    environment:
      # Used by the first-boot auth schema init script.
      - AUTH_DB_USER=${AUTH_DB_USER:-veldrath_auth}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD}
    restart: unless-stopped

  seq:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

# No proxy volumes: TLS and routing are handled by the external platform proxy.
