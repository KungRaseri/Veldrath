    xp: [8, 45]
    gold: [1, 15]
    drop_chance: [0.30, 0.60]
    intended_for: "the-droveway L1, ashlen-wood L1, grevenmire L3"
    seeded_archetypes: [giant-rat, goblin-scout, forest-wolf, bandit-ruffian]

