# docker-compose.dev.yml — Standalone development compose with hot-reload
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# This is a self-contained development compose file. All .NET services use
# the SDK image with dotnet watch, mounting source code as volumes so that
# file changes on the host trigger an automatic rebuild and restart.
#
# dotnet watch uses polling (DOTNET_USE_POLLING_FILE_WATCHER=true) which works
# reliably across Docker Desktop on Windows/macOS. The initial build happens
# inside the container on first run; subsequent file saves trigger incremental
# rebuild and application restart — typically 3-8 seconds for the server,
# faster for smaller projects.
#
# When editing non-code files (appsettings.json, .cshtml, .razor, .css) the
# restart is near-instant since no compilation is needed.
#
# ── obj/ + bin/ isolation (why this file uses anonymous volumes) ──────────
# Every bind-mounted project directory also gets anonymous volumes mounted
# over its obj/ and bin/ subdirectories, e.g.:
#     - ./Veldrath.Server:/src/Veldrath.Server
#     - /src/Veldrath.Server/obj
#     - /src/Veldrath.Server/bin
# Bind mounts bypass .dockerignore, so without these the Linux container would
# read the Windows host's obj/ (the host directory is bind-mounted at the same
# path). Host restore artifacts record Windows-only paths — for example
# obj/project.assets.json carries "packagesPath": "C:\\Users\\<user>\\.nuget\\packages\\"
# and obj/<project>.csproj.nuget.g.props carries <NuGetPackageFolders> pointing
# at the same Windows path — which makes the Linux build fail with NETSDK1064
# ("Package ... was not found") and makes dotnet-watch's polling watcher churn
# (and crash) while the host rewrites obj/ underneath it.
# The anonymous volumes give the container its own obj/bin, so restore runs
# once, cleanly, against the container-local package cache (NUGET_PACKAGES).
#
# NuGet packages live in the container-local "nuget_cache" named volume
# (mounted at /root/.nuget/packages and pinned via NUGET_PACKAGES) so a clean
# container restore never depends on the host NuGet cache.

services:
  # ── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veldrath
      POSTGRES_USER: veldrath
      POSTGRES_PASSWORD: veldrath_dev
      AUTH_DB_USER: ${AUTH_DB_USER:-veldrath_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-veldrath_auth_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-auth-schema.sh:/docker-entrypoint-initdb.d/01-auth-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veldrath -d veldrath"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Mail ────────────────────────────────────────────────────────────────
  # Mailpit catches everything the server sends, so verification and password-reset mail is inspectable
  # locally instead of being read out of the console (the server no longer logs message bodies at all).
  #   UI:   http://localhost:8025
  #   SMTP: mailpit:1025 (inside the compose network)
  # Not used in production: production SMTP is configured through Email__SmtpHost on the deployed server.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

  # ── Application services (hot-reload via dotnet watch) ───────────────────

  server:
    build:
      context: .
      dockerfile: Veldrath.Server/Dockerfile.dev
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=veldrath;Username=veldrath;Password=veldrath_dev
      - Jwt__Key=${JWT_KEY}
      - InternalBridge__Token=${INTERNAL_BRIDGE_TOKEN:-}
      # Mailpit by default so local mail is readable at http://localhost:8025; override EMAIL_SMTP_HOST to use a
      # real relay instead.
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-mailpit}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-1025}
      - Email__EnableTls=false
      - Email__SenderAddress=noreply@veldrath.local
      - Email__SenderName=Veldrath Dev
      - Web__BaseUrl=${WEB_PUBLIC_URL:-http://localhost:8081}
      - Seq__ServerUrl=http://seq
      # Container-local NuGet cache (matches the nuget_cache volume mount)
      - NUGET_PACKAGES=/root/.nuget/packages
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 200s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      # Source code — mounted for dotnet watch to detect changes.
      # Each project also gets anonymous volumes over obj/ + bin/ so the Linux
      # container never consumes the Windows host's restore artifacts.
      - ./Veldrath.Server:/src/Veldrath.Server
      - /src/Veldrath.Server/obj
      - /src/Veldrath.Server/bin
      - ./Veldrath.Contracts:/src/Veldrath.Contracts
      - /src/Veldrath.Contracts/obj
      - /src/Veldrath.Contracts/bin
      - ./Veldrath.Assets:/src/Veldrath.Assets
      - /src/Veldrath.Assets/obj
      - /src/Veldrath.Assets/bin
      - ./RealmEngine.Core:/src/RealmEngine.Core
      - /src/RealmEngine.Core/obj
      - /src/RealmEngine.Core/bin
      - ./RealmEngine.Data:/src/RealmEngine.Data
      - /src/RealmEngine.Data/obj
      - /src/RealmEngine.Data/bin
      - ./RealmEngine.Shared:/src/RealmEngine.Shared
      - /src/RealmEngine.Shared/obj
      - /src/RealmEngine.Shared/bin
      # Root MSBuild files
      - ./Directory.Build.props:/src/Directory.Build.props
      - ./Directory.Build.targets:/src/Directory.Build.targets
      - ./Directory.Packages.props:/src/Directory.Packages.props
      - ./versions:/src/versions
      # Persisted state
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - nuget_cache:/root/.nuget/packages

  discord:
    build:
      context: .
      dockerfile: Veldrath.Discord/Dockerfile.dev
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Discord__Token=${DISCORD_TOKEN}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Discord__ServerBaseUrl=http://server:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=veldrath;Username=veldrath;Password=veldrath_dev
      # Container-local NuGet cache (matches the nuget_cache volume mount)
      - NUGET_PACKAGES=/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Anonymous obj/ + bin/ volumes isolate the Linux build from the Windows host
      - ./Veldrath.Discord:/src/Veldrath.Discord
      - /src/Veldrath.Discord/obj
      - /src/Veldrath.Discord/bin
      - ./Veldrath.Contracts:/src/Veldrath.Contracts
      - /src/Veldrath.Contracts/obj
      - /src/Veldrath.Contracts/bin
      - ./RealmEngine.Core:/src/RealmEngine.Core
      - /src/RealmEngine.Core/obj
      - /src/RealmEngine.Core/bin
      - ./RealmEngine.Data:/src/RealmEngine.Data
      - /src/RealmEngine.Data/obj
      - /src/RealmEngine.Data/bin
      - ./RealmEngine.Shared:/src/RealmEngine.Shared
      - /src/RealmEngine.Shared/obj
      - /src/RealmEngine.Shared/bin
      - ./Directory.Build.props:/src/Directory.Build.props
      - ./Directory.Build.targets:/src/Directory.Build.targets
      - ./Directory.Packages.props:/src/Directory.Packages.props
      - ./versions:/src/versions
      - nuget_cache:/root/.nuget/packages

  seq:
    image: datalust/seq:latest
    ports:
      - "9001:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9003:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "9002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  web:
    build:
      context: ./web
      dockerfile: client/Dockerfile.dev
    ports:
      - "8081:5173"
    environment:
      - NODE_ENV=development
      - ORIGIN=http://localhost:8081
      - BETTER_AUTH_URL=http://localhost:8081
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me}
      - DATABASE_URL=postgres://${AUTH_DB_USER:-veldrath_auth}:${AUTH_DB_PASSWORD:-veldrath_auth_dev}@postgres:5432/veldrath
      - JWT_KEY=${JWT_KEY:-dev-secret-key-change-in-production-must-be-32-chars}
      - JWT_ISSUER=Veldrath.Server
      - JWT_AUDIENCE=Veldrath.Client
      - PUBLIC_API_URL=${SERVER_PUBLIC_URL:-http://localhost:9000}
      - PUBLIC_HUB_URL=${SERVER_PUBLIC_URL:-http://localhost:9000}/hubs/game
      - INTERNAL_BRIDGE_URL=http://server:8080
      - INTERNAL_BRIDGE_TOKEN=${INTERNAL_BRIDGE_TOKEN:-}
      - DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${OAUTH_DISCORD_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${OAUTH_MICROSOFT_TENANT_ID:-}
    volumes:
      # Bind-mounted source for Vite HMR; keep the image's node_modules.
      - ./web:/app
      - /app/node_modules
      - /app/client/node_modules
    command: sh -c "node /app/migrate.mjs && npm run dev -- --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy

volumes:
  postgres_data:
  dataprotection_keys:
  seq_data:
  prometheus_data:
  grafana_data:
  nuget_cache:
