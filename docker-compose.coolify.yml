# docker-compose.coolify.yml — Coolify-compatible single-file compose stack for veldrath.com
#
# SvelteKit web + .NET API stack for Coolify.
# No Caddy: routing, TLS, and forwarded headers are handled by Coolify's Traefik.
# Traefik labels are defined per-service below for explicit routing.
# All application services use pre-built GHCR images.
# Host port mappings are removed; traffic is routed via Traefik on the coolify network.
#
# Pre-deploy prerequisites:
#   1. Configure GHCR registry credentials in Coolify.
#   2. Set DATABASE_URL to the Coolify Postgres connection. The web entrypoint
#      creates the auth schema and applies Drizzle migrations on first boot.
#   3. Set BETTER_AUTH_SECRET and JWT_KEY; the same JWT_KEY is used by the
#      server and by SvelteKit token minting.
#
# Coolify Secrets Required (create these in Coolify dashboard):
#
#   REQUIRED (no defaults — deployment fails without these):
#     POSTGRES_PASSWORD     — Postgres superuser password
#     POSTGRES_HOST         — Coolify-managed Postgres hostname (e.g., veldrath-db)
#     POSTGRES_PORT         — Postgres port (e.g., 5432)
#     DATABASE_URL          — Postgres connection for Better Auth (schema-qualified)
#     BETTER_AUTH_SECRET    — Better Auth session secret (≥32 chars)
#     JWT_KEY               — HMAC-SHA signing key (≥32 chars)
#     DISCORD_TOKEN         — Discord bot token
#     EMAIL_SMTP_HOST       — SMTP relay hostname (mxroute.com)
#     EMAIL_USER            — SMTP auth username
#     EMAIL_PASSWORD        — SMTP auth password
#     SEQ_ADMIN_PASSWORD    — Seq admin password
#     GF_ADMIN_PASSWORD     — Grafana admin password
#
#   OPTIONAL (have defaults, override if needed):
#     OAUTH_DISCORD_CLIENT_ID / OAUTH_DISCORD_CLIENT_SECRET
#     OAUTH_GOOGLE_CLIENT_ID / OAUTH_GOOGLE_CLIENT_SECRET
#     OAUTH_MICROSOFT_CLIENT_ID / OAUTH_MICROSOFT_CLIENT_SECRET
#     EMAIL_SMTP_PORT (default: 587)
#     EMAIL_ENABLE_TLS (default: true)
#     EMAIL_SENDER_ADDRESS (default: noreply@veldrath.com)
#     DISCORD_DEV_GUILD_ID (default: 0)
#     (there are no configurable public-URL variables here — the origins are
#     fixed to https://veldrath.com and https://api.veldrath.com)

services:
  # ── Application Services ────────────────────────────────────────────────────

  server:
    container_name: veldrath-server
    image: ghcr.io/kungraseri/veldrath-server:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Require;
      - Jwt__Key=${JWT_KEY}
      - InternalBridge__Token=${INTERNAL_BRIDGE_TOKEN}
      - Email__SmtpHost=${EMAIL_SMTP_HOST}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__EnableTls=${EMAIL_ENABLE_TLS:-true}
      - Email__User=${EMAIL_USER}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__SenderAddress=${EMAIL_SENDER_ADDRESS:-noreply@veldrath.com}
      - Email__SenderName=Veldrath
      - Web__BaseUrl=https://veldrath.com
      - Seq__ServerUrl=http://veldrath-seq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`api.veldrath.com`)"
      - "traefik.http.routers.server.tls.certresolver=coolify"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.services.server.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    networks:
      veldrath:
      coolify:
        aliases:
          - veldrath-server
          - server
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "1.0"

  discord:
    image: ghcr.io/kungraseri/veldrath-discord:latest
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8083
      - Discord__Token=${DISCORD_TOKEN}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Discord__ServerBaseUrl=http://server:8080
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Require;
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - veldrath
      - coolify
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  web:
    container_name: veldrath-web
    image: ghcr.io/kungraseri/veldrath-web:latest
    environment:
      - NODE_ENV=production
      - ORIGIN=https://veldrath.com
      - BETTER_AUTH_URL=https://veldrath.com
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=Veldrath.Server
      - JWT_AUDIENCE=Veldrath.Client
      - PUBLIC_API_URL=https://api.veldrath.com
      - PUBLIC_HUB_URL=https://api.veldrath.com/hubs/game
      # Internal container URL for the temporary Identity account bridge.
      - INTERNAL_BRIDGE_URL=http://server:8080
      - INTERNAL_BRIDGE_TOKEN=${INTERNAL_BRIDGE_TOKEN}
      - DISCORD_CLIENT_ID=${OAUTH_DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${OAUTH_DISCORD_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${OAUTH_MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${OAUTH_MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${OAUTH_MICROSOFT_TENANT_ID:-}
      # Coolify's Traefik sets these forwarded headers.
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`veldrath.com`)"
      - "traefik.http.routers.web.tls.certresolver=coolify"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.services.web.loadbalancer.server.port=8081"
      - "traefik.http.services.web.loadbalancer.server.scheme=http"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      veldrath:
      coolify:
        aliases:
          - veldrath-web
          - web
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  veldrath:
    driver: bridge
  coolify:
    external: true

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  dataprotection_keys:
