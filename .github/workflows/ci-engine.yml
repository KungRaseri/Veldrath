name: CI - Engine Libraries

# Forgejo-native. Actions resolve from this instance's DEFAULT_ACTIONS_URL
# (github.com here), so a name must exist there, and it must not need the GitHub
# API. Artifact actions must be v3. Read docs/ci-forgejo.md before changing any
# 'uses:' line - two of the failure modes cost under a second and log nothing.

concurrency:
  group: ci-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, development ]
    paths:
      - 'RealmEngine.Core/**'
      - 'RealmEngine.Shared/**'
      - 'RealmEngine.Data/**'
      - 'RealmEngine.Core.Tests/**'
      - 'RealmEngine.Shared.Tests/**'
      - 'RealmEngine.Data.Tests/**'
      - 'versions/engine.props'
      - 'Directory.Build.props'
      - 'scripts/generate-version.sh'
      - 'scripts/forgejo-pr-comment.sh'
      - '.github/workflows/ci-engine.yml'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'RealmEngine.Core/**'
      - 'RealmEngine.Shared/**'
      - 'RealmEngine.Data/**'
      - 'RealmEngine.Core.Tests/**'
      - 'RealmEngine.Shared.Tests/**'
      - 'RealmEngine.Data.Tests/**'
      - 'versions/engine.props'
      - 'Directory.Build.props'
      - 'scripts/generate-version.sh'
      - 'scripts/forgejo-pr-comment.sh'
      - '.github/workflows/ci-engine.yml'
  workflow_dispatch:

env:
  # Pinned SDK: '10.0.x' resolved to 10.0.403, which dotnet-install could not find.
  DOTNET_VERSION: '10.0.402'
  CONFIGURATION: 'Release'
  PROPS_FILE: 'versions/engine.props'

jobs:
  build-and-test:
    name: Build and Test Engine Libraries
    # The engine libraries and their tests are platform-neutral, so Linux keeps
    # them on the same runner label as the server and web jobs.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # The wiki lives in a separate repository; none of the jobs here need it.
        submodules: false

    # Replaces actions/setup-dotnet; see docs/ci-forgejo.md for the toolchain rules.
    - name: Install the .NET SDK
      run: bash scripts/ci-toolchain.sh

    - name: Generate version
      id: version
      run: |
        VERSION="$(bash scripts/generate-version.sh --output-format string --props-file "${PROPS_FILE}")"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "Generated engine version: ${VERSION}"

    - name: Restore dependencies
      run: dotnet restore RealmEngine.slnx

    - name: Build
      run: dotnet build RealmEngine.slnx --configuration "${CONFIGURATION}" --no-restore

    # Formatting gate. It used to be its own repo-wide workflow (format.yml); it lives here instead so a
    # component PR fails on the formatting of the code it actually changed, and so there is one fewer
    # workflow to maintain. `dotnet format` is cheap once the project is restored and built.
    - name: Verify formatting
      run: dotnet format RealmEngine.slnx --verify-no-changes --no-restore

    - name: Test - RealmEngine.Shared.Tests
      run: |
        dotnet test RealmEngine.Shared.Tests/RealmEngine.Shared.Tests.csproj \
          --configuration "${CONFIGURATION}" --no-build --verbosity normal \
          --collect "XPlat Code Coverage" --settings coverage.runsettings \
          --logger "trx;LogFileName=shared-tests.trx" \
          --results-directory ./TestResults

    - name: Test - RealmEngine.Core.Tests
      run: |
        dotnet test RealmEngine.Core.Tests/RealmEngine.Core.Tests.csproj \
          --configuration "${CONFIGURATION}" --no-build --verbosity normal \
          --collect "XPlat Code Coverage" --settings coverage.runsettings \
          --logger "trx;LogFileName=core-tests.trx" \
          --results-directory ./TestResults

    - name: Test - RealmEngine.Data.Tests
      run: |
        dotnet test RealmEngine.Data.Tests/RealmEngine.Data.Tests.csproj \
          --configuration "${CONFIGURATION}" --no-build --verbosity normal \
          --collect "XPlat Code Coverage" --settings coverage.runsettings \
          --logger "trx;LogFileName=data-tests.trx" \
          --results-directory ./TestResults

    - name: Install ReportGenerator
      run: bash scripts/ci-toolchain.sh --reportgenerator

    - name: Generate coverage report
      run: reportgenerator "-reports:./TestResults/*/coverage.cobertura.xml" "-targetdir:./CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

    # Replaces codecov/codecov-action. Codecov is GitHub/GitLab/Bitbucket-only, so
    # the report is published as a build artifact and summarised on the PR instead.
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-engine
        path: CoverageReport/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-engine
        path: TestResults/
        retention-days: 14

    # Replaces marocchino/sticky-pull-request-comment: same behaviours (one comment
    # per PR, edited in place) through the Forgejo API.
    - name: Comment the coverage summary on the pull request
      if: github.event_name == 'pull_request'
      env:
        FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
        FORGEJO_REPOSITORY: ${{ github.repository }}
        FORGEJO_SERVER_URL: ${{ github.server_url }}
      run: |
        bash scripts/forgejo-pr-comment.sh \
          --pr "${{ github.event.pull_request.number }}" \
          --body-file CoverageReport/SummaryGithub.md \
          --marker '<!-- ci-coverage-engine -->'

  package:
    name: Package Engine Artifacts
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
      FORGEJO_REPOSITORY: ${{ github.repository }}
      FORGEJO_SERVER_URL: ${{ github.server_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false

    - name: Install the .NET SDK
      run: bash scripts/ci-toolchain.sh

    - name: Generate version
      id: version
      run: |
        VERSION="$(bash scripts/generate-version.sh --output-format string --props-file "${PROPS_FILE}")"
        VERSION_NO_HASH="${VERSION%-*}"
        echo "version=${VERSION_NO_HASH}" >> "${GITHUB_OUTPUT}"
        echo "Engine version: ${VERSION_NO_HASH}"

    - name: Restore and build
      run: |
        dotnet restore RealmEngine.slnx
        dotnet build RealmEngine.slnx --configuration "${CONFIGURATION}" --no-restore

    - name: Package - Libraries
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        mkdir -p package/Libraries
        cp -R RealmEngine.Shared/bin/"${CONFIGURATION}"/net10.0/* package/Libraries/
        cp -R RealmEngine.Core/bin/"${CONFIGURATION}"/net10.0/* package/Libraries/
        cp -R RealmEngine.Data/bin/"${CONFIGURATION}"/net10.0/* package/Libraries/
        (cd package && zip -r "../RealmEngine-Libraries-${VERSION}.zip" .)
        echo "Created RealmEngine-Libraries-${VERSION}.zip"

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: engine-release-artifacts
        path: RealmEngine-Libraries-*.zip
        retention-days: 7

    # The tag is created through the API rather than `git push`: it needs no git
    # credentials in the runner, and creating it twice is a no-op.
    - name: Create the release tag
      run: |
        set -eu
        TAG="engine/v${{ steps.version.outputs.version }}"
        CODE="$(curl -sS -o "${RUNNER_TEMP}/tag.json" -w '%{http_code}' -X POST \
          -H "Authorization: token ${FORGEJO_TOKEN}" -H 'Content-Type: application/json' \
          -d "{\"tag_name\":\"${TAG}\",\"target\":\"${GITHUB_SHA}\"}" \
          "${FORGEJO_SERVER_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/tags")"
        case "${CODE}" in
          201|200) echo "Created tag ${TAG}" ;;
          409|422) echo "Tag ${TAG} already exists" ;;
          *) echo "error: creating tag ${TAG} failed with HTTP ${CODE}" >&2
             cat "${RUNNER_TEMP}/tag.json" >&2
             exit 1 ;;
        esac

    - name: Build release notes
      run: |
        set -eu
        VERSION="${{ steps.version.outputs.version }}"
        TAG="engine/v${VERSION}"
        PREV_TAG="$(git tag --sort=-version:refname | grep '^engine/v' | grep -v "^${TAG}$" | head -1 || true)"
        if [ -n "${PREV_TAG}" ]; then
          echo "Changelog from ${PREV_TAG} to ${TAG}"
          CHANGELOG="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges)"
        else
          echo "First engine release - using the last 20 commits"
          CHANGELOG="$(git log --pretty=format:'- %s (%h)' --no-merges --max-count=20)"
        fi
        [ -n "${CHANGELOG}" ] || CHANGELOG="- Initial release"
        {
          echo "## RealmEngine Libraries ${VERSION}"
          echo ""
          echo "Core, Shared, and Data assemblies for consumption by any .NET application."
          echo ""
          echo "### Packages"
          echo "- \`RealmEngine-Libraries-${VERSION}.zip\` - Core, Shared, and Data assemblies"
          echo ""
          echo "### Changes"
          printf '%s\n' "${CHANGELOG}"
        } > release-body.md
        cat release-body.md

    # Replaces softprops/action-gh-release.
    - name: Publish the release
      run: |
        bash scripts/forgejo-release.sh \
          --tag "engine/v${{ steps.version.outputs.version }}" \
          --name "RealmEngine Libraries ${{ steps.version.outputs.version }}" \
          --body-file release-body.md \
          --asset "RealmEngine-Libraries-${{ steps.version.outputs.version }}.zip"
