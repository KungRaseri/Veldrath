name: CI - Merge gate

# Forgejo-native. This workflow deliberately has NO on.pull_request.paths filter: it is
# the one check that reports on every pull request into development and main, so the ["*"]
# branch-protection rule always has at least one status to evaluate. A change that matches
# no other workflow's paths (a root dotfile, a .slnx, docker-compose.dev.yml, config/grafana)
# otherwise reports nothing and deadlocks the merge. See docs/ci-forgejo.md,
# "The always-on check that keeps * satisfiable". Do not add paths here.
#
# Keep it free of network, SDK, npm and docker steps: it runs on every pull request.

concurrency:
  group: ci-merge-gate-${{ github.ref }}
  # Never cancel. This is the only workflow that still runs on a pull request into `main` —
  # the release PR (`development` → `main`) — and a cancelled run is recorded as a *failing*
  # status on the commit it was started for (`failure`, description "Has been cancelled",
  # measured on Forgejo 15.0.11), which for that pull request is a `development` commit.
  # Queuing instead costs one ~6 s job per push, and a superseded run still reports on its
  # own commit. See docs/ci-forgejo.md, "What runs where".
  cancel-in-progress: false

on:
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  gate:
    name: Merge gate reports on every pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Lint the workflow definitions
        run: bash scripts/ci-merge-gate.sh --lint
