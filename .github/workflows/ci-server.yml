name: CI - Server (Veldrath.Server)

# Forgejo-native. See the header of ci-engine.yml and docs/ci-forgejo.md before
# adding an action: anything not mirrored on data.forgejo.org aborts the job.
#
# Images are published to the Forgejo container registry on this instance, not
# ghcr.io. Coolify pulls from ${REGISTRY}/veldrath/veldrath-server.

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, development ]
    paths:
      - 'Veldrath.Server/**'
      - 'Veldrath.Server.Tests/**'
      - 'RealmEngine.Core/**'
      - 'RealmEngine.Shared/**'
      - 'RealmEngine.Data/**'
      - 'versions/server.props'
      - 'versions/engine.props'
      - 'Directory.Build.props'
      - 'docker-compose.yml'
      - 'scripts/generate-version.sh'
      - 'scripts/forgejo-pr-comment.sh'
      - 'scripts/forgejo-release.sh'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Veldrath.Server/**'
      - 'Veldrath.Server.Tests/**'
      - 'RealmEngine.Core/**'
      - 'RealmEngine.Shared/**'
      - 'RealmEngine.Data/**'
      - 'versions/server.props'
      - 'versions/engine.props'
      - 'Directory.Build.props'
      - 'scripts/generate-version.sh'
      - 'scripts/forgejo-pr-comment.sh'
      - 'scripts/forgejo-release.sh'
      - '.github/workflows/ci-server.yml'
  workflow_dispatch:

env:
  # Pinned SDK: '10.0.x' resolved to 10.0.403, which dotnet-install could not find.
  DOTNET_VERSION: '10.0.402'
  CONFIGURATION: 'Release'
  PROPS_FILE: 'versions/server.props'
  # Forgejo container registry. The owner segment is lowercased where it is used,
  # because registry paths must be lowercase and the org is "Veldrath".
  REGISTRY: git.kungraseri.cloud
  IMAGE_NAME: veldrath-server

jobs:
  build-and-test:
    name: Build and Test Server
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false

    # Replaces actions/setup-dotnet, which is not mirrored on data.forgejo.org.
    - name: Install the .NET SDK
      run: |
        set -eu
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o "${RUNNER_TEMP}/dotnet-install.sh"
        bash "${RUNNER_TEMP}/dotnet-install.sh" --version "${DOTNET_VERSION}" --install-dir "${HOME}/.dotnet"
        echo "${HOME}/.dotnet" >> "${GITHUB_PATH}"
        echo "DOTNET_ROOT=${HOME}/.dotnet" >> "${GITHUB_ENV}"
        export PATH="${HOME}/.dotnet:${PATH}"
        dotnet --version

    - name: Restore dependencies
      run: dotnet restore Veldrath.Server.Tests/Veldrath.Server.Tests.csproj

    - name: Build
      run: dotnet build Veldrath.Server.Tests/Veldrath.Server.Tests.csproj --configuration "${CONFIGURATION}" --no-restore

    # Formatting gate. It used to be its own repo-wide workflow (format.yml); it lives here instead so a
    # component PR fails on the formatting of the code it actually changed, and so there is one fewer
    # workflow to maintain. `dotnet format` is cheap once the project is restored and built.
    - name: Verify formatting
      run: dotnet format Veldrath.Server.slnx --verify-no-changes --no-restore

    - name: Test - Veldrath.Server.Tests
      run: |
        dotnet test Veldrath.Server.Tests/Veldrath.Server.Tests.csproj \
          --configuration "${CONFIGURATION}" --no-build --verbosity normal \
          --collect "XPlat Code Coverage" --settings coverage.runsettings \
          --logger "trx;LogFileName=server-tests.trx" \
          --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator "-reports:./TestResults/*/coverage.cobertura.xml" "-targetdir:./CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

    # Replaces codecov/codecov-action, which cannot run against Forgejo.
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-server
        path: CoverageReport/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-server
        path: TestResults/
        retention-days: 14

    # Replaces marocchino/sticky-pull-request-comment.
    - name: Comment the coverage summary on the pull request
      if: github.event_name == 'pull_request'
      env:
        FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
        FORGEJO_REPOSITORY: ${{ github.repository }}
        FORGEJO_SERVER_URL: ${{ github.server_url }}
      run: |
        bash scripts/forgejo-pr-comment.sh \
          --pr "${{ github.event.pull_request.number }}" \
          --body-file CoverageReport/SummaryGithub.md \
          --marker '<!-- ci-coverage-server -->'

  package:
    name: Package Server Artifacts
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
      FORGEJO_REPOSITORY: ${{ github.repository }}
      FORGEJO_SERVER_URL: ${{ github.server_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false

    - name: Install the .NET SDK
      run: |
        set -eu
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o "${RUNNER_TEMP}/dotnet-install.sh"
        bash "${RUNNER_TEMP}/dotnet-install.sh" --version "${DOTNET_VERSION}" --install-dir "${HOME}/.dotnet"
        echo "${HOME}/.dotnet" >> "${GITHUB_PATH}"
        echo "DOTNET_ROOT=${HOME}/.dotnet" >> "${GITHUB_ENV}"
        export PATH="${HOME}/.dotnet:${PATH}"
        dotnet --version

    - name: Generate version
      id: version
      run: |
        VERSION="$(bash scripts/generate-version.sh --output-format string --props-file "${PROPS_FILE}")"
        VERSION_NO_HASH="${VERSION%-*}"
        echo "version=${VERSION_NO_HASH}" >> "${GITHUB_OUTPUT}"
        echo "Server version: ${VERSION_NO_HASH}"

    - name: Restore and publish
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        dotnet restore Veldrath.Server/Veldrath.Server.csproj
        dotnet publish Veldrath.Server/Veldrath.Server.csproj \
          --configuration "${CONFIGURATION}" \
          --output ./publish/Veldrath-Server \
          /p:Version="${VERSION}" /p:AssemblyVersion="${VERSION}" /p:FileVersion="${VERSION}.0"
        (cd ./publish && zip -r "../Veldrath-Server-${VERSION}.zip" Veldrath-Server/)
        echo "Created Veldrath-Server-${VERSION}.zip"

    - name: Compute the image path
      id: image
      run: |
        OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
        echo "path=${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
        echo "Image: ${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Forgejo container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITEA_TOKEN }}

    # No buildx cache: `type=gha` is GitHub-only, and registry cache manifests are
    # not reliably supported by the Forgejo registry. Correct beats cached.
    - name: Build and push the image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Veldrath.Server/Dockerfile
        push: true
        tags: |
          ${{ steps.image.outputs.path }}:latest
          ${{ steps.image.outputs.path }}:${{ steps.version.outputs.version }}
        labels: |
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: server-release-artifacts
        path: Veldrath-Server-*.zip
        retention-days: 7

    - name: Create the release tag
      run: |
        set -eu
        TAG="server/v${{ steps.version.outputs.version }}"
        CODE="$(curl -sS -o "${RUNNER_TEMP}/tag.json" -w '%{http_code}' -X POST \
          -H "Authorization: token ${FORGEJO_TOKEN}" -H 'Content-Type: application/json' \
          -d "{\"tag_name\":\"${TAG}\",\"target\":\"${GITHUB_SHA}\"}" \
          "${FORGEJO_SERVER_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/tags")"
        case "${CODE}" in
          201|200) echo "Created tag ${TAG}" ;;
          409|422) echo "Tag ${TAG} already exists" ;;
          *) echo "error: creating tag ${TAG} failed with HTTP ${CODE}" >&2
             cat "${RUNNER_TEMP}/tag.json" >&2
             exit 1 ;;
        esac

    - name: Build release notes
      run: |
        set -eu
        VERSION="${{ steps.version.outputs.version }}"
        TAG="server/v${VERSION}"
        PREV_TAG="$(git tag --sort=-version:refname | grep '^server/v' | grep -v "^${TAG}$" | head -1 || true)"
        if [ -n "${PREV_TAG}" ]; then
          echo "Changelog from ${PREV_TAG} to ${TAG}"
          CHANGELOG="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges)"
        else
          echo "First server release - using the last 20 commits"
          CHANGELOG="$(git log --pretty=format:'- %s (%h)' --no-merges --max-count=20)"
        fi
        [ -n "${CHANGELOG}" ] || CHANGELOG="- Initial release"
        {
          echo "## Veldrath Server ${VERSION}"
          echo ""
          echo "Game server API for Veldrath."
          echo ""
          echo "### Docker Image"
          echo '```'
          echo "docker login ${REGISTRY}"
          echo "docker pull ${{ steps.image.outputs.path }}:${VERSION}"
          echo '```'
          echo ""
          echo "### Packages"
          echo "- \`Veldrath-Server-${VERSION}.zip\` - ASP.NET Core publish output (framework-dependent)"
          echo ""
          echo "### Changes"
          printf '%s\n' "${CHANGELOG}"
        } > release-body.md
        cat release-body.md

    # Replaces softprops/action-gh-release.
    - name: Publish the release
      run: |
        bash scripts/forgejo-release.sh \
          --tag "server/v${{ steps.version.outputs.version }}" \
          --name "Veldrath Server ${{ steps.version.outputs.version }}" \
          --body-file release-body.md \
          --asset "Veldrath-Server-${{ steps.version.outputs.version }}.zip"
