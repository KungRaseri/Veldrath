name: Formatting

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

# One repo-wide gate instead of a step in every component workflow: `dotnet format` needs the whole
# solution graph anyway, and a single run reports every deviation in one place. The rules live in the
# root `.editorconfig`; run `dotnet format Realm.Full.slnx` locally to apply them.
on:
  push:
    branches: [ main, development ]
    paths:
      - '**/*.cs'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/format.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.cs'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/format.yml'
  workflow_dispatch:

env:
  # Pinned SDK: '10.0.x' resolved to 10.0.403, which dotnet-install could not find.
  DOTNET_VERSION: '10.0.402'

permissions:
  contents: read

jobs:
  dotnet-format:
    name: dotnet format (verify no changes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Realm.Full.slnx

      - name: Verify formatting
        run: dotnet format Realm.Full.slnx --verify-no-changes --no-restore
