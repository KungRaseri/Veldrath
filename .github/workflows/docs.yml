name: Deploy Documentation

# Forgejo-native. GitHub Pages does not exist here, so the built site is published as a
# workflow artifact and — from `main` only — queued as a Coolify deployment that builds
# docs/Dockerfile into the site Traefik serves at docs.veldrath.com.

concurrency:
  group: docs-${{ github.ref }}
  # Cancel only a superseded pull-request head. A cancelled run is recorded as a *failing*
  # commit status — `failure`, description "Has been cancelled", measured on Forgejo
  # 15.0.11 — so cancelling a base-branch run leaves the merged commit, and every branch
  # built on it, red with a verdict that never happened. `development` and `main` are merged
  # in bursts, so a docs run queues for minutes behind the component jobs of the next merge
  # and used to be superseded nearly every time: 10 of the last 17 development push runs
  # ended `Has been cancelled`. A cancelled pull-request run is harmless only where the head
  # is the pull request's own branch, which is why the trigger below is `development` only:
  # the release PR (`development` → `main`) has a base-branch head, so its pull-request runs
  # would report on `development` commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# docfx.json builds the API reference from Realm.Full.slnx, so any C# change can alter the
# published docs. Watch the whole solution rather than a hand-maintained project list.
#
# Pull requests run the same build, because this workflow also owns the markdown
# relative-link check. Nothing is published from a PR: publishing is an artifact
# upload on main only (the deploy step is gated on refs/heads/main).
#
# `push` and `pull_request` share one anchored path list on purpose. Two hand-maintained copies
# drift into "this workflow never ran for that change", which is indistinguishable from a passing
# check in the run list. The list names `.github/agent-memory/**` explicitly even though `**/*.md`
# already matches it: the memory file is edited by every session, and a stale entry there is exactly
# what the link check exists to catch.
on:
  push:
    branches: [ main, development ]
    paths: &docs-paths
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'plans/**'
      - '.github/agent-memory/**'
      - '**/*.md'
      - 'toc.yml'
      - 'versions/**'
      - 'Directory.Build.props'
      - '**/*.cs'
      # The site is themed from the client's own assets: docfx.json copies the design tokens,
      # the font files and the favicons out of web/client, so a change there changes the docs.
      - 'templates/**'
      - 'web/client/src/routes/theme.css'
      - 'web/client/static/fonts/**'
      - 'web/client/static/images/favicon/**'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/check-content-names.mjs'
      - 'scripts/content-name-collisions.allow.json'
      - 'scripts/docfx-namespace-toc.pl'
      - 'scripts/apply-branch-protection.sh'
      - 'scripts/forgejo-pr-comment.sh'
      - 'scripts/lib/forgejo-api.sh'
      - 'scripts/lib/comment-json.awk'
      - 'scripts/lib/merge-coverage-sections.awk'
      - 'scripts/tests/**'
  pull_request:
    # `development` only, deliberately: the sole pull request into `main` is the release PR
    # (`development` → `main`), whose head commit is a `development` commit that already
    # carries this workflow's `push` run at that commit. Running the docs build again
    # duplicates that verdict and, when the next push supersedes it, records
    # `failure / "Has been cancelled"` on the `development` commit the superseded run was
    # started for. The merge gate lints main separately. docs/ci-forgejo.md, "What runs where".
    branches: [ development ]
    paths: *docs-paths
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (tag, release, image push, docs deploy). Off = build only.'
        type: boolean
        default: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # docfx.json builds from Realm.Full.slnx; the wiki is not part of it.
          submodules: false

      # Replaces actions/setup-dotnet; see docs/ci-forgejo.md for the toolchain rules.
      - name: Set up .NET
        run: bash scripts/ci-toolchain.sh

      - name: Restore NuGet packages
        run: dotnet restore Realm.Full.slnx

      - name: Install DocFX
        env:
          # Pinned: templates/veldrath/layout/_master.tmpl is a copy of this version's modern
          # template master. Bump together with docs/Dockerfile and re-sync that file.
          DOCFX_VERSION: 2.81.0
        run: |
          dotnet tool install --global docfx --version "$DOCFX_VERSION" \
            || dotnet tool update --global docfx --version "$DOCFX_VERSION"
          # A global tool lands in ~/.dotnet/tools, which is not on PATH here; the runner
          # does not honour $GITHUB_PATH either. /usr/local/bin always is.
          ln -sf "$HOME/.dotnet/tools/docfx" /usr/local/bin/docfx
          docfx --version

      - name: Generate API metadata
        run: docfx metadata docfx.json

      # docfx emits one flat list of 167 namespaces. Group it by namespace before the build so
      # the sidebar is a tree (RealmEngine.Core -> Features -> Combat) instead of a flat column.
      - name: Group the API table of contents by namespace
        run: perl scripts/docfx-namespace-toc.pl

      # Relative-link check. It used to be its own workflow (repo-hygiene.yml); it belongs with the
      # documentation job because that is what it protects. Offline on purpose: no external URL checks, so it
      # cannot flake on third-party availability or rate limits.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check documentation links
        run: node scripts/check-markdown-links.mjs

      # Calethic name collisions. Nothing else compared authored names against the naming authority:
      # D5 found `Orneld` one letter from `Orveld` and `Gaelraeth` one letter from `Kael-Raeth` after
      # every prior validator had passed, because those compared authored slugs to seeded slugs and
      # `docs/lore/calethic-language.md` holds no slugs at all. Offline, like the link check: it
      # reads the four content documents, the authority and both seeder directories, and fails on
      # edit distance 1 with both names, the distance and both line numbers named. A citation of an
      # attested form is canon, not a coinage, so a rename note cannot red the gate; a missing input
      # fails it rather than passing on a partial read.
      - name: Check authored names for collisions
        run: node scripts/check-content-names.mjs

      - name: Test the name-collision checker
        run: node --test scripts/tests/content-names.test.mjs

      # Offline regression tests for the branch-protection policy that makes a merge
      # here wait for CI. No token and no network: the API response is stubbed, so the
      # failures asserted here — an extra account, a push team, a deploy-key bypass, any
      # push to `development` — can be exercised without touching the live rules. The
      # script under test is the executable copy of docs/ci-forgejo.md.
      - name: Test branch-protection policy
        run: bash scripts/tests/apply-branch-protection.test.sh

      # Offline tests for the sticky PR-comment helper, the other half of the same CI
      # plumbing. A fake curl on PATH serves the comment list and records every write,
      # so "does the lookup return one scalar id" is answered without a token, a pull
      # request or the network. A duplicated id here used to reach the PATCH URL and
      # fail the coverage job as `curl (3) bad/illegal URL`.
      - name: Test the pull-request comment helper
        run: bash scripts/tests/forgejo-pr-comment.test.sh

      - name: Build documentation
        run: docfx build docfx.json

      # Replaces actions/upload-pages-artifact + actions/deploy-pages. The site is
      # downloadable from the run; serving it is up to the host.
      #
      # Tar it first: Forgejo's artifact API takes one request per file, and the site is
      # ~2400 files — a flat upload of `_site/` ran for 10+ minutes per run.
      - name: Package the generated site
        run: tar -czf docs-site.tar.gz -C _site .

      - name: Upload the generated site
        uses: actions/upload-artifact@v3
        with:
          name: docs-site
          path: docs-site.tar.gz
          retention-days: 30

      # Publishing. Forgejo has no Pages server: Coolify builds docs/Dockerfile from this
      # repository and Traefik serves the result at docs.veldrath.com. Queued here so a docs
      # change goes live with the merge; skipped when the secrets are absent (forks, PRs).
      - name: Queue the docs deployment
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DOCS_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ] || [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::warning::COOLIFY_DOCS_DEPLOY_URL / COOLIFY_TOKEN are not set — skipping"
            exit 0
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN")
          echo "coolify deploy: HTTP $code"
          cat /tmp/deploy.json 2>/dev/null || true
          [ "$code" -lt 300 ]
