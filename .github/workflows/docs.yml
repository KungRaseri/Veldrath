name: Deploy Documentation

# Forgejo-native. GitHub Pages does not exist here, so the built site is published
# as a workflow artifact instead of being deployed by actions/deploy-pages.
# Serving it is a hosting decision (a Coolify static site can serve _site/).

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# docfx.json builds the API reference from Realm.Full.slnx, so any C# change can alter the
# published docs. Watch the whole solution rather than a hand-maintained project list.
#
# Pull requests run the same build, because this workflow also owns the markdown
# relative-link check. Nothing is published from a PR: publishing is an artifact
# upload on main only.
on:
  push:
    branches: [ main ]
    paths:
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'versions/**'
      - 'Directory.Build.props'
      - '**/*.cs'
  pull_request:
    branches: [ main ]
    paths:
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
      - 'scripts/check-markdown-links.mjs'
  workflow_dispatch:

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # docfx.json builds from Realm.Full.slnx; the wiki is not part of it.
          submodules: false

      # Replaces actions/setup-dotnet; see docs/ci-forgejo.md for the toolchain rules.
      - name: Set up .NET
        run: bash scripts/ci-toolchain.sh

      - name: Restore NuGet packages
        run: dotnet restore Realm.Full.slnx

      - name: Install DocFX
        run: |
          dotnet tool install --global docfx || dotnet tool update --global docfx
          # A global tool lands in ~/.dotnet/tools, which is not on PATH here; the runner
          # does not honour $GITHUB_PATH either. /usr/local/bin always is.
          ln -sf "$HOME/.dotnet/tools/docfx" /usr/local/bin/docfx
          docfx --version

      - name: Generate API metadata
        run: docfx metadata docfx.json

      - name: Create API landing page
        run: |
          cat > api/index.md << 'EOF'
          # API Reference

          Browse the RealmEngine API documentation using the navigation on the left.

          | Project | Description |
          |---------|-------------|
          | **RealmEngine.Core** | Game logic — combat, crafting, inventory, quests, spells |
          | **RealmEngine.Shared** | Shared models, domain entities, interfaces |
          | **RealmEngine.Data** | EF Core persistence (Postgres), entity models, repositories |
          | **Veldrath.Server** | ASP.NET Core game server with SignalR |
          | **Veldrath.Discord** | Discord bot integration |
          EOF

      # Relative-link check. It used to be its own workflow (repo-hygiene.yml); it belongs with the
      # documentation job because that is what it protects. Offline on purpose: no external URL checks, so it
      # cannot flake on third-party availability or rate limits.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check documentation links
        run: node scripts/check-markdown-links.mjs

      - name: Build documentation
        run: docfx build docfx.json

      # Replaces actions/upload-pages-artifact + actions/deploy-pages. The site is
      # downloadable from the run; serving it is up to the host.
      #
      # Tar it first: Forgejo's artifact API takes one request per file, and the site is
      # ~2400 files — a flat upload of `_site/` ran for 10+ minutes per run.
      - name: Package the generated site
        run: tar -czf docs-site.tar.gz -C _site .

      - name: Upload the generated site
        uses: actions/upload-artifact@v3
        with:
          name: docs-site
          path: docs-site.tar.gz
          retention-days: 30

      # Publishing. Forgejo has no Pages server: Coolify builds docs/Dockerfile from this
      # repository and Traefik serves the result at docs.veldrath.com. Queued here so a docs
      # change goes live with the merge; skipped when the secrets are absent (forks, PRs).
      - name: Queue the docs deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DOCS_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ] || [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::warning::COOLIFY_DOCS_DEPLOY_URL / COOLIFY_TOKEN are not set — skipping"
            exit 0
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN")
          echo "coolify deploy: HTTP $code"
          cat /tmp/deploy.json 2>/dev/null || true
          [ "$code" -lt 300 ]
