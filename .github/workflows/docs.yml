name: Deploy Documentation

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# docfx.json builds the API reference from Realm.Full.slnx, so any C# change can alter the
# published docs. Watch the whole solution rather than a hand-maintained project list.
#
# Pull requests run the build too, because this workflow owns the markdown relative-link check. Only
# the deploy job is gated on a push to main, so a PR can never publish.
on:
  push:
    branches: [ main ]
    paths:
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'versions/**'
      - 'Directory.Build.props'
      - '**/*.cs'
  pull_request:
    branches: [ main ]
    paths:
      - 'docfx.json'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
      - 'scripts/check-markdown-links.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Restore NuGet packages
        run: dotnet restore Realm.Full.slnx

      - name: Install DocFX
        run: dotnet tool install --global docfx

      - name: Generate API metadata
        run: docfx metadata docfx.json

      - name: Create API landing page
        run: |
          cat > api/index.md << 'EOF'
          # API Reference

          Browse the RealmEngine API documentation using the navigation on the left.

          | Project | Description |
          |---------|-------------|
          | **RealmEngine.Core** | Game logic — combat, crafting, inventory, quests, spells |
          | **RealmEngine.Shared** | Shared models, domain entities, interfaces |
          | **RealmEngine.Data** | EF Core persistence (Postgres), entity models, repositories |
          | **Veldrath.Server** | ASP.NET Core game server with SignalR |
          | **Veldrath.Discord** | Discord bot integration |
          EOF

      # Relative-link check. It used to be its own workflow (repo-hygiene.yml); it belongs with the
      # documentation job because that is what it protects. Offline on purpose: no external URL checks, so it
      # cannot flake on third-party availability or rate limits.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check documentation links
        run: node scripts/check-markdown-links.mjs

      - name: Build documentation
        run: docfx build docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # A pull request runs the build (and the relative-link check) but must never publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
