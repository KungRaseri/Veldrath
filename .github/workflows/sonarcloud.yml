# SonarQube Cloud (formerly SonarCloud) static analysis.
#
# Setup:
#   1. Import the repository at https://sonarcloud.io and note the project key + organization key.
#   2. Create a token at https://sonarcloud.io/account/security/ and store it as the
#      repository secret SONAR_TOKEN.
#   3. Adjust the -Dsonar.projectKey / -Dsonar.organization args below if the keys change.
#
# The scanner needs full git history (`fetch-depth: 0`) for accurate blame/new-code detection.

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # allows SonarQube Cloud to decorate PRs with analysis results

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Unique keys of the project and organization (SonarQube Cloud → Information).
          args: >
            -Dsonar.projectKey=KungRaseri_RealmEngine
            -Dsonar.organization=kungraseri
