name: CI - Web (SvelteKit)

# Forgejo-native. See the header of ci-engine.yml and docs/ci-forgejo.md before
# adding an action: it must resolve from DEFAULT_ACTIONS_URL and must not need the
# GitHub API. Artifact actions must stay on v3.
#
# The web image is published to the Forgejo container registry on this instance,
# not ghcr.io.

concurrency:
  group: ci-web-${{ github.ref }}
  # Cancel only a superseded pull-request head: a run cancelled by this group is recorded as a
  # *failing* status — `failure`, description "Has been cancelled" (measured on Forgejo
  # 15.0.11) — so cancelling a base-branch run leaves the merged commit red with a verdict that
  # never happened. Losing a run is safe only on a PR whose head is its own branch; the release
  # PR (`development` → `main`) has `development` as its head, so its pull-request runs cancel
  # against `development` commits too. See docs/ci-forgejo.md, "Branch protection".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'config/postgres/**'
      - 'scripts/forgejo-pr-comment.sh'
      - 'scripts/lib/**'
      - 'scripts/coverage-report.sh'
      - 'scripts/web-coverage-gate.mjs'
      - 'scripts/check-e2e-manifest.mjs'
      - 'scripts/e2e-summary.mjs'
      - 'scripts/tests/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    # `development` only, deliberately: the sole pull request into `main` is the release PR
    # (`development` → `main`), whose head commit is a `development` commit that already
    # carries this workflow's `push` run at that commit. Running the matrix again duplicates
    # that verdict and, when the next push supersedes it, records `failure / "Has been
    # cancelled"` on the `development` commit the superseded run was started for. The merge
    # gate lints main separately. docs/ci-forgejo.md, "What runs where".
    branches: [ development ]
    paths:
      - 'web/**'
      - 'config/postgres/**'
      - 'scripts/forgejo-pr-comment.sh'
      - 'scripts/lib/**'
      - 'scripts/coverage-report.sh'
      - 'scripts/web-coverage-gate.mjs'
      - 'scripts/check-e2e-manifest.mjs'
      - 'scripts/e2e-summary.mjs'
      - 'scripts/tests/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (tag, release, image push, docs deploy). Off = build only.'
        type: boolean
        default: false

env:
  REGISTRY: git.kungraseri.cloud
  IMAGE_NAME: veldrath-web

jobs:
  build-test:
    name: Build and Test SvelteKit Web
    runs-on: ubuntu-latest

    env:
      # Service containers are reached by service name on the job network. The
      # port mapping does not publish to the job container's 127.0.0.1.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/veldrath
      BETTER_AUTH_SECRET: test-better-auth-secret-change-me-0123456789abcdef
      ORIGIN: http://localhost:4173
      JWT_KEY: test-jwt-signing-key-change-me-0123456789abcdef
      JWT_ISSUER: Veldrath.Server
      JWT_AUDIENCE: Veldrath.Client
      PUBLIC_API_URL: http://localhost:9000
      PUBLIC_HUB_URL: http://localhost:9000/hubs/game
      CI: 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veldrath
        # No host port: services are reachable by name on the job network, and a
        # published 5432 makes a second concurrent job fail to start
        # ('failed to bind host port 0.0.0.0:5432: address already in use').
        options: >-
          --health-cmd "pg_isready -U postgres -d veldrath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --allow-git=all

      - name: Verify migrations are current
        working-directory: web
        run: |
          npm run db:generate
          git diff --exit-code -- shared/db/migrations

      - name: Apply auth migrations
        working-directory: web
        run: npm run db:migrate

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: web
        run: npm run test

      # The e2e reporting scripts are tooling, not app code, so their tests run here — the one job
      # that has Node without needing the .NET SDK. Fixtures only: no browser, no server.
      - name: Test the e2e reporting tooling
        run: node --test scripts/tests/e2e-reporting.test.mjs

      # The coverage comment's gate block is generated by `Render the enforced gate summary` below;
      # its tests are fixtures of a vitest log, a json-summary and a Cobertura file, so they run
      # offline here too.
      - name: Test the coverage gate summariser
        run: node --test scripts/tests/web-coverage-gate.test.mjs

      # The unit run also executes the five parity suites in src/lib/parity, which fail when a
      # hub method, broadcast event, REST route, content type, or page route is added without a
      # web consumer or a documented exemption.
      #
      # `tee` keeps the log so the coverage comment can quote this step's own totals instead of
      # re-deriving them from the Cobertura report (which counts branches differently — see
      # scripts/web-coverage-gate.mjs). `pipefail` keeps the step's exit status npm's, so a gate
      # failure still fails the job.
      - name: Coverage gate (90% global, per-glob floors)
        working-directory: web
        run: |
          set -o pipefail
          npm run coverage --workspace client 2>&1 | tee "${RUNNER_TEMP:-/tmp}/web-coverage.log"

      # The Playwright half of the reporting. `npm run test` above ran the stack-free specs
      # through web/client/tests/run-e2e.mjs, which wrote test-results/e2e-stack-free.json.
      # Everything here runs on a red job too: a summary that only exists when the tests passed
      # is missing exactly when a reviewer needs it. See plans/e2e-reporting.md.
      - name: E2E integrity gate (stack-free)
        if: always()
        run: |
          if [ ! -f web/client/test-results/e2e-stack-free.json ]; then
            echo "no stack-free results were written; skipping the integrity gate"
            exit 0
          fi
          node scripts/check-e2e-manifest.mjs \
            --run stack-free \
            --results web/client/test-results/e2e-stack-free.json \
            --suggest

      - name: Render the E2E summary
        if: always()
        run: |
          if [ ! -f web/client/test-results/e2e-stack-free.json ]; then
            echo "no stack-free results were written; skipping the summary"
            exit 0
          fi
          node scripts/e2e-summary.mjs \
            --results web/client/test-results/e2e-stack-free.json \
            --out E2EReport/Summary.md

      # vitest writes web/client/coverage/cobertura-coverage.xml (vite.config.ts); the same
      # reporter the .NET jobs use renders it, so the PR comment and the HTML artifact cover
      # the web app too. Skipped cleanly when the gate failed before coverage was written
      # (coverage.reportOnFailure is on, so only a run that died before coverage exists skips).
      - name: Generate coverage report
        if: always()
        run: |
          if [ ! -f web/client/coverage/cobertura-coverage.xml ]; then
            echo "no web coverage file was written; skipping the report"
            exit 0
          fi
          bash scripts/coverage-report.sh \
            "-reports:web/client/coverage/cobertura-coverage.xml" \
            "-targetdir:./CoverageReport" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub;TextSummary" \
            "-title:Veldrath web coverage"

      # The comment used to lead with the reporter's branch percentage, which was counted over the
      # per-line Cobertura conditions and read lower than the number the gate enforces for the
      # same run (PR #88: 89.8% in the comment against 90.33% in the gate). The gate's own totals
      # now head the section, quoted from the coverage step's log, and the reporter (pinned v1.0.4)
      # reads its Total row from the root branch counters, so both carry the same two counts; only
      # its per-directory rows are still line-condition accounting. See scripts/web-coverage-gate.mjs.
      - name: Render the enforced gate summary
        if: always()
        run: |
          if [ ! -f web/client/coverage/coverage-summary.json ] &&
             [ ! -f "${RUNNER_TEMP:-/tmp}/web-coverage.log" ]; then
            echo "no coverage totals were written; skipping the gate summary"
            exit 0
          fi
          mkdir -p CoverageReport
          node scripts/web-coverage-gate.mjs \
            --log "${RUNNER_TEMP:-/tmp}/web-coverage.log" \
            --summary web/client/coverage/coverage-summary.json \
            --cobertura web/client/coverage/cobertura-coverage.xml \
            --out CoverageReport/GateSummary.md
          # One body file for the commenter: the gate block first, then the reporter's section.
          if [ -s CoverageReport/SummaryGithub.md ]; then
            cat CoverageReport/GateSummary.md CoverageReport/SummaryGithub.md \
              > CoverageReport/WebSection.md
          else
            echo "no reporter summary was generated; commenting with the gate block only"
            cp CoverageReport/GateSummary.md CoverageReport/WebSection.md
          fi

      # Replaces codecov/codecov-action, which cannot run against Forgejo: the collector's
      # own lcov plus the rendered report are build artifacts instead of an external upload.
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-web
          # lcov and json-summary for external viewers, CoverageReport/ for the HTML report.
          path: |
            web/client/coverage/
            CoverageReport/
          if-no-files-found: ignore
          retention-days: 14

      # Posts on a red job too: the gate block is exactly what a reader needs when the coverage
      # check failed, and a comment that only exists on green heads was the reason a stale
      # percentage could outlive the run it described.
      - name: Comment the coverage summary on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: |
          bash scripts/forgejo-pr-comment.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --section web --title 'Web (SvelteKit)' \
            --body-file CoverageReport/WebSection.md

      # Its own comment, not a section of the coverage one: test counts under a "Coverage
      # summary" heading would be the wrong document. The script skips cleanly when the summary
      # was never rendered, so a red job cannot fail here over a comment.
      - name: Comment the E2E summary on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: |
          bash scripts/forgejo-pr-comment.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --marker '<!-- ci-e2e -->' \
            --heading '## E2E summary' \
            --section e2e --title 'E2E (stack-free)' \
            --body-file E2EReport/Summary.md

      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: web/client/build
          if-no-files-found: ignore
          retention-days: 14

      # `playwright-report/<run>/index.html` is openable and carries the traces; before the
      # reporters were configured this path never existed and the step was green and empty.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-playwright-report
          path: |
            web/client/playwright-report
            web/client/test-results
            E2EReport
          if-no-files-found: ignore
          retention-days: 14

  # The authenticated workflows — the game loop and the Foundry journeys — need the real .NET API
  # (every SvelteKit loader calls it server-side) and a live SignalR hub, so this job boots
  # Veldrath.Server against the Postgres service instead of mocking anything.
  e2e-game:
    name: Authenticated e2e (real server)
    needs: build-test
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:9000
      # Pinned SDK: '10.0.x' resolved to 10.0.403, which dotnet-install could not find.
      DOTNET_VERSION: '10.0.402'
      CI: 'true'
      # SvelteKit (SSR + Better Auth)
      # Service containers are reached by service name on the job network. The
      # port mapping does not publish to the job container's 127.0.0.1.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/veldrath
      BETTER_AUTH_SECRET: test-better-auth-secret-change-me-0123456789abcdef
      ORIGIN: http://localhost:4173
      BETTER_AUTH_URL: http://localhost:4173
      JWT_KEY: test-jwt-signing-key-change-me-0123456789abcdef
      JWT_ISSUER: Veldrath.Server
      JWT_AUDIENCE: Veldrath.Client
      PUBLIC_API_URL: http://127.0.0.1:9000
      PUBLIC_HUB_URL: http://127.0.0.1:9000/hubs/game
      INTERNAL_BRIDGE_URL: http://127.0.0.1:9000
      INTERNAL_BRIDGE_TOKEN: test-internal-bridge-token-change-me
      # Playwright spec gates: the game loop and the Foundry journeys.
      E2E_GAME: '1'
      E2E_STACK: '1'
      E2E_API_URL: http://127.0.0.1:9000
      # The manifest's ports are the local isolated stack (4273/9100/55432). This job brings its
      # own Postgres service and starts the API itself, so the preview stays on 4173 — the value
      # ORIGIN and BETTER_AUTH_URL above already name.
      E2E_WEB_PORT: '4173'
      # The specs register dozens of accounts a minute from one address, so Better Auth's shared
      # per-path bucket answers 429 and the run fails during sign-up. The API is given the same
      # treatment (RateLimit__* below); the limits stay on everywhere else.
      AUTH_RATE_LIMIT_DISABLED: 'true'
      # A role granted by the harness has to be usable on the next request; the snapshot cache is
      # what stands in the way, and these specs are the only place it is not wanted.
      Auth__AccessCacheSeconds: '0'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veldrath
        # No host port: services are reachable by name on the job network, and a
        # published 5432 makes a second concurrent job fail to start
        # ('failed to bind host port 0.0.0.0:5432: address already in use').
        options: >-
          --health-cmd "pg_isready -U postgres -d veldrath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      # Replaces actions/setup-dotnet; see docs/ci-forgejo.md for the toolchain rules.
      - name: Install the .NET SDK
        run: bash scripts/ci-toolchain.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --allow-git=all

      - name: Apply auth migrations
        working-directory: web
        run: npm run db:migrate

      # The server migrates and seeds its databases at startup, so only the connection string
      # and the shared secrets/jwt settings are needed here.
      - name: Start Veldrath.Server
        working-directory: Veldrath.Server
        run: |
          ConnectionStrings__DefaultConnection="Host=postgres;Port=5432;Database=veldrath;Username=postgres;Password=postgres" \
          Jwt__Key="$JWT_KEY" \
          Jwt__Issuer="$JWT_ISSUER" \
          Jwt__Audience="$JWT_AUDIENCE" \
          Web__BaseUrl="$ORIGIN" \
          Cors__AllowedOrigins__0="$ORIGIN" \
          InternalBridge__Token="$INTERNAL_BRIDGE_TOKEN" \
          RateLimit__AdminActionsPerMinute=600 \
          RateLimit__FoundryWritesPerMinute=600 \
          nohup dotnet run --no-launch-profile > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            sleep 3
            if curl -fsS http://127.0.0.1:9000/health > /dev/null; then
              echo "server healthy after $((attempt * 3))s"
              exit 0
            fi
          done
          echo "server did not become healthy" >&2
          tail -n 120 "$RUNNER_TEMP/server.log" >&2
          exit 1

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The spec list comes from web/client/tests/e2e-manifest.json, the same file the local
      # `npm run test:e2e:stack` reads. It used to be copied here by hand, and the copy had
      # dropped tests/encounters.e2e.ts — the combat and death journey never ran in CI.
      #
      # `playwright.config.ts` points the preview it starts at `E2E_API_PORT` / `E2E_DB_URL`, and
      # its defaults are the *local* isolated stack (API on 9100, Postgres on 55432). This job runs
      # its own API on 9000 against the postgres service, so both have to name that instead —
      # otherwise every spec dies at sign-up with ECONNREFUSED 127.0.0.1:9100.
      - name: Run the authenticated specs
        working-directory: web/client
        env:
          E2E_API_PORT: '9000'
          E2E_DB_URL: ${{ env.DATABASE_URL }}
        run: node tests/run-e2e.mjs stack

      # Runs alone on purpose: the spec stops the API to prove the pages say so. Sharing a run with
      # the specs above would take the API away from whichever of them were in flight. In this job
      # the API is started by `dotnet run`, so the spec self-skips and the report says why.
      - name: Run the upstream-failure spec
        working-directory: web/client
        env:
          E2E_API_PORT: '9000'
          E2E_DB_URL: ${{ env.DATABASE_URL }}
        run: node tests/run-e2e.mjs outage

      - name: E2E integrity gate
        if: always()
        run: |
          for run in stack outage; do
            results="web/client/test-results/e2e-${run}.json"
            if [ ! -f "${results}" ]; then
              echo "no results for the ${run} run; skipping its integrity check"
              continue
            fi
            node scripts/check-e2e-manifest.mjs --run "${run}" --results "${results}" --suggest
          done

      - name: Render the E2E summary
        if: always()
        run: |
          args=""
          for run in stack outage; do
            results="web/client/test-results/e2e-${run}.json"
            [ -f "${results}" ] && args="${args} --results ${results}"
          done
          if [ -z "${args}" ]; then
            echo "no results were written; skipping the summary"
            exit 0
          fi
          node scripts/e2e-summary.mjs ${args} --out E2EReport/Summary.md

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

      - name: Comment the E2E summary on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITEA_TOKEN }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: |
          bash scripts/forgejo-pr-comment.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --marker '<!-- ci-e2e -->' \
            --heading '## E2E summary' \
            --section e2e-stack --title 'E2E (isolated stack, real server)' \
            --body-file E2EReport/Summary.md

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-game-e2e-report
          path: |
            web/client/playwright-report
            web/client/test-results
            E2EReport
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package Web Image
    needs: build-test
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # A job container has no docker socket unless it declares one; without this
    # the buildx step fails with 'Cannot connect to the Docker daemon'.
    container:
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Compute the image path
        id: image
        run: |
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "path=${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Image: ${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          # A PAT with write:package: the automatic GITEA_TOKEN is refused by the
          # registry (401 Unauthorized: reqPackageAccess).
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Registry-backed buildx cache. `type=gha` is GitHub-only and the `dir`
      # cache type cannot leave the job container, but Forgejo's registry does store
      # the cache manifest at `<image>:buildcache` (verified: a warm build logs CACHED).
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: web/client/Dockerfile
          # SvelteKit 3 inlines public env vars into the browser bundle at build
          # time and validates them from process.env at startup; the Dockerfile
          # re-declares these args as runtime ENV defaults so the image boots
          # without extra runtime config.
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.veldrath.com' }}
            PUBLIC_HUB_URL=${{ vars.PUBLIC_HUB_URL || 'https://api.veldrath.com/hubs/game' }}
          push: true
          cache-from: type=registry,ref=${{ steps.image.outputs.path }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.path }}:buildcache,mode=max
          tags: |
            ${{ steps.image.outputs.path }}:latest
            ${{ steps.image.outputs.path }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
