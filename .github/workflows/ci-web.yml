name: CI - Web (SvelteKit)

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, development]
    paths:
      - 'web/**'
      - 'config/postgres/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'config/postgres/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: veldrath-web

jobs:
  build-test:
    name: Build and Test SvelteKit Web
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/veldrath
      BETTER_AUTH_SECRET: test-better-auth-secret-change-me-0123456789abcdef
      ORIGIN: http://localhost:4173
      JWT_KEY: test-jwt-signing-key-change-me-0123456789abcdef
      JWT_ISSUER: Veldrath.Server
      JWT_AUDIENCE: Veldrath.Client
      PUBLIC_API_URL: http://localhost:9000
      PUBLIC_HUB_URL: http://localhost:9000/hubs/game
      CI: 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veldrath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veldrath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --allow-git=all

      - name: Verify migrations are current
        working-directory: web
        run: |
          npm run db:generate
          git diff --exit-code -- shared/db/migrations

      - name: Apply auth migrations
        working-directory: web
        run: npm run db:migrate

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Build desktop bundle
        working-directory: web
        run: npm run build:desktop

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: web
        run: npm run test

      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            web/client/build
            web/client/build-desktop
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          path: |
            web/client/playwright-report
            web/client/test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package Web Image
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image registry path
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: web/client/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.registry }}:latest
            ${{ steps.image.outputs.registry }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: package
    if: false # temporarily disabled — remove this line when the VPS is ready
    uses: ./.github/workflows/deploy.yml
    with:
      service: web
    secrets:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
